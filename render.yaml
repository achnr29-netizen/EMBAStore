services:
  - type: web
    name: ancastore
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: BASE_URL
        sync: false
      - key: DB_PATH
        sync: false
      - key: SESSION_SECRET
        generateValue: true
